name: sgia-rag

services:
  qdrant:
    image: qdrant/qdrant:v1.18.0
    restart: unless-stopped
    ports:
      - "${RAG_QDRANT_PORT:-6337}:6333"
      - "${RAG_QDRANT_GRPC_PORT:-6338}:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  rag-api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    init: true
    depends_on:
      qdrant:
        condition: service_started
    environment:
      RAG_DATA_ROOT: /app/data
      RAG_MODEL_CONFIG_PATH: /app/config/models.json
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-sgia_rag_chunks_titan_v2_512}
      AWS_REGION: ${AWS_REGION:-eu-central-1}
      AWS_DEFAULT_REGION: ${AWS_REGION:-eu-central-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      BEDROCK_EMBEDDING_MODEL_ID: ${BEDROCK_EMBEDDING_MODEL_ID:-}
      BEDROCK_EMBEDDING_DIMENSIONS: ${BEDROCK_EMBEDDING_DIMENSIONS:-}
      BEDROCK_GENERATION_MODEL_ID: ${BEDROCK_GENERATION_MODEL_ID:-}
      RAG_GENERATION_TEMPERATURE: ${RAG_GENERATION_TEMPERATURE:-}
      RAG_GENERATION_MAX_OUTPUT_TOKENS: ${RAG_GENERATION_MAX_OUTPUT_TOKENS:-}
      RAG_CHAT_TOP_K: ${RAG_CHAT_TOP_K:-10}
      RAG_CHAT_CANDIDATE_POOL_SIZE: ${RAG_CHAT_CANDIDATE_POOL_SIZE:-24}
      RAG_CHAT_NEIGHBOR_WINDOW: ${RAG_CHAT_NEIGHBOR_WINDOW:-1}
      RAG_CHAT_COVERAGE_RETRY_ENABLED: ${RAG_CHAT_COVERAGE_RETRY_ENABLED:-true}
      RAG_CHAT_COVERAGE_MIN_RATIO: ${RAG_CHAT_COVERAGE_MIN_RATIO:-0.8}
      RAG_CHAT_MAX_RETRIEVAL_ATTEMPTS: ${RAG_CHAT_MAX_RETRIEVAL_ATTEMPTS:-2}
      RAG_CHAT_MAX_CONTEXT_CHARACTERS: ${RAG_CHAT_MAX_CONTEXT_CHARACTERS:-60000}
      RAG_CHUNK_MAX_TOKENS: ${RAG_CHUNK_MAX_TOKENS:-600}
      RAG_CHUNK_OVERLAP_TOKENS: ${RAG_CHUNK_OVERLAP_TOKENS:-100}
      RAG_MAX_UPLOAD_BYTES: ${RAG_MAX_UPLOAD_BYTES:-104857600}
      DOCLING_DO_OCR: ${DOCLING_DO_OCR:-}
    ports:
      - "${RAG_API_PORT:-8001}:8000"
    volumes:
      - ./config/models.json:/app/config/models.json:ro
      - rag_data:/app/data
      - docling_model_cache:/root/.cache

  rag-ui:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    init: true
    depends_on:
      rag-api:
        condition: service_healthy
    environment:
      RAG_API_URL: http://rag-api:8000
    ports:
      - "${RAG_UI_PORT:-8502}:8501"

volumes:
  qdrant_data:
    name: sgia_rag_qdrant_data
  rag_data:
    name: sgia_rag_data
  docling_model_cache:
    name: sgia_rag_docling_model_cache
